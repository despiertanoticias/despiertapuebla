[build]
  publish = "."
  command = "node scripts/build.mjs"
  # Lo publicado desde /admin no gasta créditos: ver scripts/omitir-build.sh
  ignore = "bash scripts/omitir-build.sh"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Va después de /assets/* para que gane: la lista de notas siempre se revisa.
[[headers]]
  for = "/assets/datos.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "https://www.despiertapuebla.com.mx/*"
  to = "https://despiertapuebla.com.mx/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/privacidad"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
